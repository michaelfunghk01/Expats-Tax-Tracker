<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expat Tax Tracker Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mobile-container">
        <header>
            <h1>🌐 Expat Tax Shield</h1>
            <p>Database-Less Local Simulation</p>
        </header>

        <!-- Profile Toggle Box -->
        <section class="card profile-card">
            <h3>Select Strategy Profile</h3>
            <div class="toggle-group">
                <button id="btn-ppt" class="active" onclick="switchProfile('PPT')">Physical Presence</button>
                <button id="btn-bfr" onclick="switchProfile('BFR')">Bona Fide Resident</button>
            </div>
        </section>

        <!-- Live Dashboard Output Screen -->
        <section class="card dashboard-card">
            <h3>Calculated Status</h3>
            <div id="status-badge" class="badge badge-safe">🟢 SAFE</div>
            <div id="dashboard-metrics">
                <!-- Math strings inject here dynamically -->
            </div>
        </section>

        <!-- Log Entry Interaction Form -->
        <section class="card form-card">
            <h3>+ Log New Trip</h3>
            <form id="trip-form" onsubmit="handleFormSubmit(event)">
                <label>Arrival Location:</label>
                <select id="trip-location">
                    <option value="MEX">Foreign Territory (Mexico)</option>
                    <option value="US">United States Soil</option>
                </select>

                <div class="row">
                    <div>
                        <label>Start Date:</label>
                        <input type="date" id="trip-start" required>
                    </div>
                    <div>
                        <label>End Date:</label>
                        <input type="date" id="trip-end" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Save Trip to Phone Memory</button>
            </form>
        </section>

        <!-- Visual Table Log List -->
        <section class="card history-card">
            <h3>Stored Travel History Logs</h3>
            <ul id="log-list">
                <!-- Log item strings append here -->
            </ul>
            <button class="btn-clear" onclick="wipeLocalCache()">Wipe Device Memory Clear</button>
        </section>
    </div>

    <script src="engine.js"></script>
</body>
</html>
