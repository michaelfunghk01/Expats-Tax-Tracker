<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songyah Expats: FEIE Tax Shield</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #2a6cff 0%, #82c7ff 40%, #f0f2f5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .mobile-container {
            background: rgba(255,255,255,0.97);
            width: 100%;
            max-width: 412px;
            border-radius: 30px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.6);
        }
        header {
            text-align: center;
            border-bottom: 1px solid #d7e1f5;
            padding-bottom: 14px;
            background: linear-gradient(90deg, rgba(42,108,255,0.1), rgba(130,199,255,0.08));
            border-radius: 20px;
            margin: -20px -20px 10px;
            padding-top: 20px;
        }
        h1 { font-size: 24px; color: #0f234d; margin: 0; }
        header p { font-size: 13px; color: #3d556f; margin: 8px 0 0 0; }
        .card { background: #ffffff; border-radius: 20px; padding: 18px; margin-top: 15px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 18px 38px rgba(0,0,0,0.12); }
        h3 { margin-top: 0; font-size: 15px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.7px; }
        label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px 0; color: #555; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        .btn-submit {
            background: linear-gradient(90deg, #007aff, #34c759);
            color: white;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,122,255,0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 22px rgba(0,122,255,0.24); }
        .btn-clear { background: #fff5f5; border: 1px solid #ffccd3; color: #d32f2f; font-size: 13px; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; text-align: center; padding: 12px; border-radius: 12px; }
        .badge { display: inline-block; padding: 8px 14px; border-radius: 999px; font-weight: bold; font-size: 14px; margin-bottom: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .btn-start {
            background: linear-gradient(90deg, #ff9f00, #ff5e5e);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 14px;
        }
        .btn-start:hover {
            opacity: 0.95;
        }
        .btn-secondary {
            background: #ffffff;
            border: 1px solid #007aff;
            color: #007aff;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background: #f0f8ff;
        }
        .header-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .help-text {
            font-size: 12px;
            color: #2a3f6f;
            margin-top: 8px;
        }
        .toggle-group { display: flex; gap: 10px; }
        .toggle-group button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #ddd; }
        .toggle-group button.active { background: #007aff; color: white; }
        .badge-safe { background: #e2fbe8; color: #1b873a; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        ul { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        li { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; color: #333; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header>
            <h1>🌐 Songyah Expats: FEIE Tax Shield</h1>
            <p>Database-Less Local Simulation</p>
            <div class="header-actions">
                <button class="btn-start" onclick="loadSampleTrips()">Get Started with Sample Data</button>
                <button class="btn-secondary" onclick="wipeLocalCache()">Clear Sample Data</button>
            </div>
            <p class="help-text">Use sample data to test the app, then clear it to return to real data entry.</p>
        </header>

        <!-- Profile Toggle Box -->
        <section class="card profile-card">
            <h3>Select Strategy Profile</h3>
            <div class="toggle-group">
                <button id="btn-ppt" class="active" onclick="switchProfile('PPT')">Physical Presence</button>
                <button id="btn-bfr" onclick="switchProfile('BFR')">Bona Fide Resident</button>
            </div>
        </section>

        <!-- Live Dashboard Output Screen -->
        <section class="card dashboard-card">
            <h3>Calculated Status</h3>
            <div id="status-badge" class="badge badge-safe">🟢 SAFE</div>
            <div id="dashboard-metrics">
                <!-- Math strings inject here dynamically -->
            </div>
        </section>

        <!-- Log Entry Interaction Form -->
        <section class="card form-card">
            <h3>+ Log New Trip</h3>
            <form id="trip-form" onsubmit="handleFormSubmit(event)">
                <label>Arrival Location:</label>
                <select id="trip-location">
                    <option value="MEX">Foreign Territory (Mexico)</option>
                    <option value="US">United States Soil</option>
                </select>

                <div class="row">
                    <div>
                        <label>Start Date:</label>
                        <input type="date" id="trip-start" required onchange="updateEndMinDate()">
                    </div>
                    <div>
                        <label>End Date:</label>
                        <input type="date" id="trip-end" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Save Trip to Phone Memory</button>
            </form>
        </section>

        <!-- Visual Table Log List -->
        <section class="card history-card">
            <h3>Stored Travel History Logs</h3>
            <ul id="log-list">
                <!-- Log item strings append here -->
            </ul>
            <button class="btn-clear" onclick="wipeLocalCache()">Wipe Device Memory Clear</button>
        </section>
    </div>

    <script src="engine.js"></script>
</body>
</html>
